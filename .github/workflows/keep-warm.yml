name: Keep CA FirmHub warm

# Pings the live app so Render free tier is less likely to sleep.
# Does not replace a paid always-on plan, but greatly reduces the black "SERVICE WAKING UP" screen.

on:
  schedule:
    - cron: "*/12 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake CA FirmHub
        run: |
          set -e
          URL="${{ secrets.APP_URL }}"
          if [ -z "$URL" ]; then
            URL="https://cafh.onrender.com"
          fi
          URL="${URL%/}"
          echo "Pinging $URL/api/health ..."
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /tmp/health.json -w "%{http_code}" --max-time 45 "$URL/api/health" || echo "000")
            echo "Attempt $i → HTTP $code"
            if [ "$code" = "200" ]; then
              head -c 200 /tmp/health.json || true
              echo
              exit 0
            fi
            sleep 15
          done
          echo "Health check did not return 200 (service may still be cold). Non-fatal."
          exit 0
