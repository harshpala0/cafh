<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CA FirmHub — Starting</title>
<style>
  :root { --navy:#0B1F3A; --accent:#1e5a4b; --bg:#0f1720; --text:#e8eef2; --muted:#9aa8b5; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at 30% 20%, #1a2f28 0%, var(--bg) 55%);
    color: var(--text); font: 15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    padding: 24px;
  }
  .card {
    width: min(420px, 100%); text-align: center; padding: 36px 28px;
    background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px; backdrop-filter: blur(8px);
  }
  .logo {
    width: 64px; height: 64px; margin: 0 auto 16px; border-radius: 14px;
    background: linear-gradient(145deg, var(--accent), var(--navy));
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 18px; letter-spacing: -0.02em;
  }
  h1 { margin: 0 0 8px; font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
  p { margin: 0 0 18px; color: var(--muted); font-size: 13.5px; }
  .bar {
    height: 4px; border-radius: 999px; background: rgba(255,255,255,0.08);
    overflow: hidden; margin: 18px 0 10px;
  }
  .bar > i {
    display: block; height: 100%; width: 40%; border-radius: 999px;
    background: linear-gradient(90deg, var(--accent), #6fc2a6);
    animation: slide 1.4s ease-in-out infinite;
  }
  @keyframes slide {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(280%); }
  }
  .status { font-size: 12px; color: var(--muted); min-height: 1.4em; }
  .status.ok { color: #6fc2a6; }
  .status.err { color: #f0a0a0; }
  .hint { margin-top: 20px; font-size: 11.5px; color: var(--muted); opacity: 0.85; }
  a { color: #8fd4be; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">CA</div>
    <h1>CA FirmHub</h1>
    <p>Preparing your workspace and connecting to the database…</p>
    <div class="bar"><i></i></div>
    <div class="status" id="st">Starting service…</div>
    <p class="hint">Designed &amp; Built by Harsh Pala<br>
      First open after idle can take 30–60 seconds on free hosting.</p>
  </div>
<script>
(function () {
  var st = document.getElementById('st');
  var tries = 0;
  var max = 40;
  var target = '/';

  function set(msg, cls) {
    st.textContent = msg;
    st.className = 'status' + (cls ? ' ' + cls : '');
  }

  function ping() {
    tries++;
    fetch('/api/health', { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json().catch(function () { return {}; });
      })
      .then(function () {
        set('Ready — opening CA FirmHub…', 'ok');
        setTimeout(function () { location.replace(target); }, 400);
      })
      .catch(function () {
        if (tries >= max) {
          set('Still starting. Tap to retry.', 'err');
          st.style.cursor = 'pointer';
          st.onclick = function () { tries = 0; set('Retrying…'); ping(); };
          return;
        }
        set('Waking database & app… (' + tries + '/' + max + ')');
        setTimeout(ping, 3000);
      });
  }
  ping();
})();
</script>
</body>
</html>
