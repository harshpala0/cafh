<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#003366">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Client Portal — CA FirmHub</title>
<link rel="icon" type="image/png" href="/static/favicon.png">
<link rel="manifest" href="/static/manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#003366;--navy-d:#002244;--navy-m:#004080;--gold:#B8860B;--bg:#F0F4F8;--surface:#fff;--border:#D1DAEA;--text:#1A2332;--text2:#4A5568;--text3:#718096;--ok:#1E7E44;--ok-bg:#E8F5EE;--warn:#C05621;--warn-bg:#FEF3EB;--err:#C53030;--err-bg:#FFF0F0;--info:#1A5699;--info-bg:#EBF4FF;--r:8px;--sh:0 1px 4px rgba(0,51,102,.06),0 2px 8px rgba(0,51,102,.04)}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;min-height:100vh}a{color:var(--navy-m);text-decoration:none}button,input,select,textarea{font:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:var(--r);border:0;cursor:pointer;font-weight:600;font-size:13.5px;transition:.15s}
.btn-p{background:var(--navy);color:#fff}.btn-p:hover{background:var(--navy-m)}.btn-o{background:#fff;border:1.5px solid var(--border);color:var(--text)}.btn-o:hover{border-color:var(--navy)}.btn-sm{padding:6px 12px;font-size:12.5px}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600}.b-open{background:var(--warn-bg);color:var(--warn)}.b-ok{background:var(--ok-bg);color:var(--ok)}.b-info{background:var(--info-bg);color:var(--info)}.b-muted{background:#EDF2F7;color:var(--text3)}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(145deg,var(--navy-d),var(--navy) 50%,var(--navy-m))}
.login-card{background:#fff;border-radius:16px;padding:36px 28px;width:100%;max-width:400px;box-shadow:0 24px 64px rgba(0,0,0,.3)}
.login-card h1{font-family:Poppins,sans-serif;font-size:22px;color:var(--navy);margin-bottom:4px}.login-card .sub{color:var(--text3);font-size:13px;margin-bottom:22px}
.fg{margin-bottom:14px}.fg label{display:block;font-size:11px;font-weight:600;color:var(--text2);margin-bottom:5px;letter-spacing:.03em}
.fg input{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:var(--r);outline:0}.fg input:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(0,51,102,.1)}
.err{display:none;background:var(--err-bg);color:var(--err);border:1px solid #FCA5A5;padding:10px 12px;border-radius:var(--r);font-size:13px;margin-bottom:14px}
#app{display:none;min-height:100vh;flex-direction:column}
.top{background:var(--navy);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:20}
.top .brand{font-family:Poppins,sans-serif;font-weight:700;font-size:15px}.top .meta{font-size:12px;opacity:.85}
.nav{display:flex;gap:4px;overflow-x:auto;background:#fff;border-bottom:1px solid var(--border);padding:8px 12px;position:sticky;top:52px;z-index:15;-webkit-overflow-scrolling:touch}
.nav button{flex:0 0 auto;padding:8px 14px;border:0;background:transparent;border-radius:999px;font-weight:600;font-size:13px;color:var(--text2);cursor:pointer}.nav button.on{background:var(--navy);color:#fff}
.main{padding:16px;max-width:960px;margin:0 auto;width:100%;flex:1}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:20px}@media(min-width:640px){.cards{grid-template-columns:repeat(4,1fr)}}
.stat{background:#fff;border-radius:12px;padding:16px;box-shadow:var(--sh);border:1px solid var(--border)}.stat .n{font-size:24px;font-weight:700;color:var(--navy);font-family:Poppins,sans-serif}.stat .l{font-size:11px;color:var(--text3);font-weight:600;margin-top:2px;text-transform:uppercase;letter-spacing:.04em}
.panel{background:#fff;border-radius:12px;border:1px solid var(--border);box-shadow:var(--sh);overflow:hidden;margin-bottom:16px}
.panel-h{padding:14px 16px;border-bottom:1px solid var(--border);font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:8px}.panel-b{padding:12px 16px}
.row{padding:12px 0;border-bottom:1px solid #EEF2F7}.row:last-child{border-bottom:0}.row .t{font-weight:600;font-size:14px}.row .s{font-size:12px;color:var(--text3);margin-top:2px}
.empty{text-align:center;padding:28px 12px;color:var(--text3);font-size:13px}
textarea{width:100%;min-height:80px;padding:10px;border:1.5px solid var(--border);border-radius:var(--r);resize:vertical}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;font-weight:600;z-index:99;display:none;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.file-input{display:none}.upload-zone{border:2px dashed var(--border);border-radius:12px;padding:20px;text-align:center;color:var(--text3);cursor:pointer;margin-top:10px}.upload-zone:hover{border-color:var(--navy);background:var(--info-bg)}
</style>
</head>
<body>
<div id="login">
  <div class="login-card">
    <div style="width:48px;height:48px;background:linear-gradient(135deg,var(--navy),var(--navy-m));border-radius:12px;display:flex;align-items:center;justify-content:center;margin-bottom:14px">
      <svg width="24" height="24" fill="none" stroke="#DAA520" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
    </div>
    <h1>Client Portal</h1>
    <p class="sub">Secure access to your engagement status, documents &amp; queries.</p>
    <div class="err" id="lerr"></div>
    <div class="fg"><label>USERNAME</label><input id="lu" autocomplete="username" placeholder="Your portal username"></div>
    <div class="fg"><label>PASSWORD</label><input id="lp" type="password" autocomplete="current-password" placeholder="Password" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <button class="btn btn-p" style="width:100%" onclick="doLogin()">Sign In →</button>
    <p style="margin-top:16px;font-size:12px;color:var(--text3);text-align:center">Credentials are issued by your Chartered Accountant firm.</p>
  </div>
</div>
<div id="app">
  <header class="top">
    <div>
      <div class="brand" id="firmName">CA FirmHub</div>
      <div class="meta" id="clientName">Client Portal</div>
    </div>
    <button class="btn btn-sm btn-o" style="background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25);color:#fff" onclick="logout()">Logout</button>
  </header>
  <nav class="nav" id="nav">
    <button class="on" data-t="home" onclick="tab('home')">Home</button>
    <button data-t="engagements" onclick="tab('engagements')">Engagements</button>
    <button data-t="queries" onclick="tab('queries')">Queries</button>
    <button data-t="requests" onclick="tab('requests')">Documents</button>
    <button data-t="invoices" onclick="tab('invoices')">Invoices</button>
  </nav>
  <main class="main" id="main"></main>
</div>
<div class="toast" id="toast"></div>
<script>
const API='';let T=localStorage.getItem('portal_at')||localStorage.getItem('at')||'';let ME=null;
function toast(m){const el=document.getElementById('toast');el.textContent=m;el.style.display='block';setTimeout(()=>el.style.display='none',2500)}
function authH(){return{Authorization:'Bearer '+T,'Content-Type':'application/json'}}
async function api(path,opts={}){const r=await fetch(API+path,{...opts,headers:{...authH(),...(opts.headers||{})}});if(r.status===401){logout();throw new Error('Session expired');}const ct=r.headers.get('content-type')||'';const data=ct.includes('json')?await r.json():await r.text();if(!r.ok)throw new Error((data&&data.detail)||r.statusText);return data;}
async function doLogin(){const u=document.getElementById('lu').value.trim();const p=document.getElementById('lp').value;const err=document.getElementById('lerr');err.style.display='none';try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});const d=await r.json();if(!r.ok)throw new Error(d.detail||'Login failed');if(d.user.role!=='Client'){localStorage.setItem('at',d.access_token);localStorage.setItem('au',JSON.stringify(d.user));location.href='/';return;}T=d.access_token;localStorage.setItem('portal_at',T);localStorage.setItem('at',T);localStorage.setItem('au',JSON.stringify(d.user));await boot();}catch(e){err.textContent=e.message;err.style.display='block'}}
function logout(){T='';ME=null;localStorage.removeItem('portal_at');localStorage.removeItem('at');localStorage.removeItem('au');document.getElementById('app').style.display='none';document.getElementById('login').style.display='flex';}
async function boot(){try{ME=await api('/api/portal/me');}catch(e){logout();return;}document.getElementById('login').style.display='none';document.getElementById('app').style.display='flex';document.getElementById('firmName').textContent=ME.firm?.name||'CA FirmHub';document.getElementById('clientName').textContent=(ME.client?.name||'Client')+' · Portal';tab('home');}
function tab(name){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===name));const map={home:renderHome,engagements:renderEng,queries:renderQueries,requests:renderReqs,invoices:renderInv};(map[name]||renderHome)();}
async function renderHome(){const main=document.getElementById('main');main.innerHTML='<div class="empty">Loading…</div>';try{const d=await api('/api/portal/dashboard');main.innerHTML=`<div class="cards"><div class="stat"><div class="n">${d.engagements}</div><div class="l">Engagements</div></div><div class="stat"><div class="n">${d.open_queries}</div><div class="l">Open queries</div></div><div class="stat"><div class="n">${d.open_doc_requests}</div><div class="l">Doc requests</div></div><div class="stat"><div class="n">${d.invoices_pending}</div><div class="l">Pending invoices</div></div></div><div class="panel"><div class="panel-h">Welcome</div><div class="panel-b"><p style="margin-bottom:8px">Hello <strong>${ME.user.full_name}</strong>.</p><p style="color:var(--text2);font-size:13px">Use the tabs above to view engagements, respond to queries, upload requested documents, and check invoices.</p></div></div>`;}catch(e){main.innerHTML=`<div class="empty">${e.message}</div>`}}
async function renderEng(){const main=document.getElementById('main');main.innerHTML='<div class="empty">Loading…</div>';try{const rows=await api('/api/portal/engagements');if(!rows.length){main.innerHTML='<div class="empty">No engagements yet.</div>';return}main.innerHTML=`<div class="panel"><div class="panel-h">Your engagements</div><div class="panel-b">${rows.map(e=>`<div class="row"><div class="t">${esc(e.title)}</div><div class="s">${esc(e.engagement_type||'')} · FY ${esc(e.financial_year||'')} · <span class="badge b-info">${esc(e.status||'')}</span>${e.due_date?(' · Due '+e.due_date):''}</div></div>`).join('')}</div></div>`;}catch(e){main.innerHTML=`<div class="empty">${e.message}</div>`}}
async function renderQueries(){const main=document.getElementById('main');main.innerHTML='<div class="empty">Loading…</div>';try{const rows=await api('/api/portal/queries');if(!rows.length){main.innerHTML='<div class="empty">No queries.</div>';return}main.innerHTML=`<div class="panel"><div class="panel-h">Queries from your firm</div><div class="panel-b">${rows.map(q=>`<div class="row" id="q${q.id}"><div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start"><div class="t">#${q.sr_no||q.id} · ${esc(q.engagement_title||'')}</div><span class="badge ${q.status==='Open'?'b-open':q.status==='Responded'?'b-ok':'b-muted'}">${q.status}</span></div><div class="s" style="margin:8px 0;color:var(--text)">${esc(q.query_text)}</div>${q.response?`<div style="background:var(--ok-bg);padding:8px 10px;border-radius:8px;font-size:13px;margin-bottom:8px"><strong>Your response:</strong> ${esc(q.response)}</div>`:''}${q.status==='Open'?`<textarea id="qr${q.id}" placeholder="Type your response…"></textarea><button class="btn btn-p btn-sm" style="margin-top:8px" onclick="respondQuery(${q.id})">Submit response</button>`:''}</div>`).join('')}</div></div>`;}catch(e){main.innerHTML=`<div class="empty">${e.message}</div>`}}
async function respondQuery(id){const t=document.getElementById('qr'+id).value.trim();if(!t){toast('Please enter a response');return}try{await api('/api/portal/queries/'+id+'/respond',{method:'POST',body:JSON.stringify({response:t})});toast('Response submitted');renderQueries();}catch(e){toast(e.message)}}
async function renderReqs(){const main=document.getElementById('main');main.innerHTML='<div class="empty">Loading…</div>';try{const [reqs,docs]=await Promise.all([api('/api/portal/doc-requests'),api('/api/portal/documents')]);main.innerHTML=`<div class="panel"><div class="panel-h">Document requests from firm</div><div class="panel-b">${reqs.length?reqs.map(r=>`<div class="row"><div style="display:flex;justify-content:space-between;gap:8px"><div class="t">${esc(r.title)}</div><span class="badge ${r.status==='Open'?'b-open':r.status==='Submitted'?'b-ok':'b-muted'}">${r.status}</span></div><div class="s">${esc(r.description||'')} ${r.due_date?('· Due '+r.due_date):''} · ${r.file_count||0} file(s)</div>${r.status!=='Closed'?`<div class="upload-zone" onclick="document.getElementById('f${r.id}').click()">📎 Tap to upload file for this request<input class="file-input" type="file" id="f${r.id}" onchange="uploadFile(${r.id}, this)"></div>`:''}</div>`).join(''):'<div class="empty">No document requests right now.</div>'}</div></div><div class="panel"><div class="panel-h">Document register</div><div class="panel-b">${docs.length?docs.map(d=>`<div class="row"><div class="t">${esc(d.doc_name)}</div><div class="s">${esc(d.doc_type)} · ${d.doc_date||''} · ${esc(d.status||'')} ${d.reference_no?('· Ref '+esc(d.reference_no)):''}</div></div>`).join(''):'<div class="empty">No documents logged yet.</div>'}</div></div>`;}catch(e){main.innerHTML=`<div class="empty">${e.message}</div>`}}
async function uploadFile(rid,input){if(!input.files||!input.files[0])return;const fd=new FormData();fd.append('file',input.files[0]);fd.append('request_id',rid);try{const r=await fetch('/api/portal/upload',{method:'POST',headers:{Authorization:'Bearer '+T},body:fd});const d=await r.json();if(!r.ok)throw new Error(d.detail||'Upload failed');toast('File uploaded');renderReqs();}catch(e){toast(e.message)}}
async function renderInv(){const main=document.getElementById('main');main.innerHTML='<div class="empty">Loading…</div>';try{const rows=await api('/api/portal/invoices');if(!rows.length){main.innerHTML='<div class="empty">No invoices.</div>';return}main.innerHTML=`<div class="panel"><div class="panel-h">Invoices</div><div class="panel-b">${rows.map(i=>`<div class="row"><div style="display:flex;justify-content:space-between;gap:8px"><div class="t">${esc(i.invoice_no||('#'+i.id))}</div><span class="badge ${['Paid','Settled'].includes(i.status)?'b-ok':'b-open'}">${esc(i.status||'')}</span></div><div class="s">Date ${i.invoice_date||'—'} · Amount ₹${fmt(i.total_amount)} · Paid ₹${fmt(i.amount_paid)}</div></div>`).join('')}</div></div>`;}catch(e){main.innerHTML=`<div class="empty">${e.message}</div>`}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmt(n){const x=Number(n||0);return x.toLocaleString('en-IN',{maximumFractionDigits:2})}
(async()=>{if(T){try{await boot()}catch(e){logout()}}})();
</script>
</body>
</html>
